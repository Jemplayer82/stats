services:
  stats:
    build: .
    image: stats:latest
    container_name: stats
    ports:
      - "5000:5000"
    environment:
      - DATABASE_URL=sqlite:////data/usage.db
    volumes:
      - stats_data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3

volumes:
  stats_data:
