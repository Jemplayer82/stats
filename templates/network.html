{% extends "base.html" %}
{% block title %}Network{% endblock %}
{% block content %}

<h1>Network</h1>

<section id="net-section">

  <div style="margin-bottom:1rem">
    <div class="px-column" style="border-radius:10px;overflow:hidden">
      <div class="px-column-header node-unifi">
        <span class="px-column-title">
          <img src="https://cdn.jsdelivr.net/gh/homarr-labs/dashboard-icons/webp/unifi.webp" class="server-icon"> UniFi Network
        </span>
        <span class="server-header-right" id="net-sub">
          <span class="chart-sub" style="color:#fff;opacity:.7">loading…</span>
        </span>
      </div>
      <div style="padding:.75rem 1rem" id="net-overview"></div>
    </div>
  </div>

  <div id="net-devices" class="net-device-grid" style="margin-bottom:1.5rem"></div>

  <div id="net-sites"></div>

</section>

<script>
function formatUptime(seconds) {
  if (!seconds || seconds === 0) return 'off';
  const d = Math.floor(seconds / 86400);
  const h = Math.floor(seconds % 86400 / 3600);
  const m = Math.floor(seconds % 3600 / 60);
  if (d > 0) return `${d}d ${h}h`;
  if (h > 0) return `${h}h ${m}m`;
  return `${m}m`;
}

const TYPE_ICONS  = { ugw: '🛡️', uap: '📡', usw: '🔀', console: '🖥️', pdu: '🔌', ulte: '📶', uck: '☁️' };
const TYPE_LABELS = { ugw: 'Gateway', uap: 'Access Point', usw: 'Switch', console: 'Console', pdu: 'Power', ulte: 'LTE', uck: 'Cloud Key' };
const TYPE_ORDER  = { ugw: 0, console: 1, usw: 2, uap: 3, pdu: 4, ulte: 5, uck: 6 };

function renderDevice(d) {
  const online = d.state === 1;
  const icon   = TYPE_ICONS[d.type]  || '📟';
  const label  = TYPE_LABELS[d.type] || (d.type ? d.type.toUpperCase() : 'Device');

  const fwBadge = d.updateAvailable
    ? `<span class="badge" style="background:rgba(245,158,11,.2);color:#f59e0b;margin-left:.4rem">update</span>`
    : (d.firmwareStatus === 'upToDate' ? '' : '');

  const rows = [
    d.uptime  ? `<div class="px-vm-bar-row"><span class="px-label">Uptime</span><div style="flex:1"></div><span class="px-vm-pct">${formatUptime(d.uptime)}</span></div>` : '',
    d.ip      ? `<div class="px-vm-bar-row"><span class="px-label">IP</span><div style="flex:1"></div><span class="px-vm-pct" style="font-family:monospace;font-size:.7rem">${d.ip}</span></div>` : '',
    d.version ? `<div class="px-vm-bar-row"><span class="px-label">FW</span><div style="flex:1"></div><span class="px-vm-pct" style="color:var(--muted)">${d.version}</span></div>` : '',
    d.site    ? `<div class="px-vm-bar-row"><span class="px-label">Site</span><div style="flex:1"></div><span class="px-vm-pct" style="color:var(--muted)">${d.site}</span></div>` : '',
  ].filter(Boolean).join('');

  return `
    <div class="px-card ${!online ? 'is-off' : ''}">
      <div class="px-top">
        <span class="px-type">${icon} ${label}</span>
      </div>
      <div class="px-name">${d.name}${fwBadge}${d.model ? `<br><small style="font-weight:400;color:var(--muted);font-size:.75rem">${d.model}</small>` : ''}</div>
      <div class="px-stats" style="margin-top:.5rem">${rows}</div>
      <div class="px-status ${online ? 'on' : 'off'}">${online ? 'online' : 'offline'}</div>
    </div>`;
}

function renderSites(sites) {
  if (!sites || sites.length === 0) return '';

  return sites.map(s => {
    const txRetry = s.txRetry != null ? `${s.txRetry.toFixed(1)}%` : null;
    const txClass = s.txRetry > 20 ? 'signal-weak' : s.txRetry > 10 ? 'signal-ok' : 'signal-good';

    const wansHtml = (s.wans || []).map(w => {
      const uptimePct = w.uptime != null ? w.uptime.toFixed(1) : null;
      const upCls = w.uptime == null ? '' : w.uptime >= 99 ? 'signal-good' : w.uptime >= 90 ? 'signal-ok' : 'signal-weak';
      return `
        <div class="tn-spark-wrap" style="flex:1;min-width:180px">
          <div class="tn-spark-title">${w.name} ${w.isp ? `<span style="font-weight:400;color:var(--muted)">${w.isp}</span>` : ''}</div>
          ${w.externalIp ? `<div style="font-size:.75rem;color:var(--muted);margin:.2rem 0;font-family:monospace">${w.externalIp}</div>` : ''}
          ${uptimePct != null ? `<div style="font-size:.8rem">Uptime: <span class="${upCls}">${uptimePct}%</span></div>` : ''}
        </div>`;
    }).join('');

    return `
      <div style="margin-bottom:1rem">
        <div class="px-column" style="border-radius:10px;overflow:hidden">
          <div class="px-column-header" style="background:#1e3a5f;border-bottom-color:#1e3a5f">
            <span class="px-column-title" style="color:#fff">${s.name}</span>
            <span class="server-header-right">
              <span class="server-uptime">${s.wifiClients} wireless · ${s.wiredClients} wired</span>
              <span class="px-status on" style="position:static;border-radius:4px">${s.wifiClients + s.wiredClients} clients</span>
            </span>
          </div>
          <div style="padding:.75rem 1rem">
            <div class="ceph-grid" style="flex-wrap:wrap;gap:.75rem">
              ${wansHtml}
              ${txRetry ? `
              <div class="tn-spark-wrap" style="flex:1;min-width:160px">
                <div class="tn-spark-title">TX Retry</div>
                <div style="font-size:1.4rem;font-weight:700;margin-top:.25rem" class="${txClass}">${txRetry}</div>
                <div style="font-size:.7rem;color:var(--muted);margin-top:.2rem">avg retry rate</div>
              </div>` : ''}
            </div>
          </div>
        </div>
      </div>`;
  }).join('');
}

async function loadNetworkStatus() {
  const sub       = document.getElementById('net-sub');
  const overview  = document.getElementById('net-overview');
  const devicesEl = document.getElementById('net-devices');
  const sitesEl   = document.getElementById('net-sites');

  try {
    const res  = await fetch('/api/unifi-status');
    const data = await res.json();

    if (data.error === 'incomplete_config') {
      sub.innerHTML = '<span class="chart-sub" style="color:#fff;opacity:.7">not configured</span>';
      overview.innerHTML = '<a href="/settings" class="setup-link">Configure UniFi →</a>';
      devicesEl.innerHTML = '';
      sitesEl.innerHTML   = '';
      return;
    }
    if (data.error) {
      sub.innerHTML = `<span class="px-status off" style="position:static;border-radius:4px">error</span>`;
      overview.innerHTML = `<span style="color:var(--red);font-size:.85rem">${data.error}: ${data.details || ''}</span>`;
      return;
    }

    const onlineCount = data.devices.filter(d => d.state === 1).length;
    sub.innerHTML = `
      <span class="server-uptime">${onlineCount}/${data.devices.length} devices online</span>
      <span class="px-status on" style="position:static;border-radius:4px">connected</span>`;

    const byType = t => data.devices.filter(d => d.type === t).length;
    overview.innerHTML = `
      <div class="net-summary">
        <div class="ceph-stat"><span class="ceph-val">${data.total_clients}</span><span class="ceph-lbl">Clients</span></div>
        <div class="ceph-stat"><span class="ceph-val">${data.wireless_clients}</span><span class="ceph-lbl">Wireless</span></div>
        <div class="ceph-stat"><span class="ceph-val">${data.wired_clients}</span><span class="ceph-lbl">Wired</span></div>
        <div class="ceph-stat" style="margin-left:auto">
          <span class="ceph-val" style="font-size:.85rem">
            ${byType('ugw')} gateway · ${byType('usw')} switch · ${byType('uap')} AP · ${byType('pdu')} PDU
          </span>
          <span class="ceph-lbl">infrastructure</span>
        </div>
      </div>`;

    const sorted = [...data.devices].sort((a, b) =>
      (TYPE_ORDER[a.type] ?? 9) - (TYPE_ORDER[b.type] ?? 9) ||
      (a.site || '').localeCompare(b.site || '') ||
      (a.name || '').localeCompare(b.name || '')
    );

    devicesEl.innerHTML = sorted.map(renderDevice).join('');
    sitesEl.innerHTML   = renderSites(data.sites);

  } catch (e) {
    document.getElementById('net-sub').innerHTML =
      `<span class="px-status off" style="position:static;border-radius:4px">error</span>`;
  }
}

loadNetworkStatus();
setInterval(loadNetworkStatus, 30_000);
</script>

{% endblock %}
